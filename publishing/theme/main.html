{% extends "base.html" %}
{% block extrahead %}
  {% set description = page.meta.description if page and page.meta.description else config.site_description %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name | e }}">
  <meta property="og:title" content="{{ page.title | e }} — {{ config.site_name | e }}">
  <meta property="og:description" content="{{ description | e }}">
  <meta property="og:url" content="{{ page.canonical_url | e }}">
  <meta property="og:image" content="{{ config.site_url }}assets/qinzora-banner.jpg">
  <meta name="robots" content="index, follow">
{% endblock %}

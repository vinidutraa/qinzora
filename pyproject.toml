[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qinzora"
version = "0.4.1"
description = "Evidence-based API policy evaluation, replay simulation and controlled enforcement"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["api-security", "policy-engine", "rate-limiting", "tenant-isolation", "historical-simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.urls]
Repository = "https://github.com/vinidutraa/qinzora"
Documentation = "https://vinidutraa.github.io/qinzora/"
Issues = "https://github.com/vinidutraa/qinzora/issues"
Changelog = "https://github.com/vinidutraa/qinzora/blob/main/docs/history.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[project.scripts]
qinzora = "qinzora.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qinzora"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/docs", "/publishing", "/.github", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/pyproject.toml", "/requirements*.txt", "/Dockerfile", "/compose.yaml", "/mkdocs.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qinzora"
version = "0.3.14"
description = "Evidence-based API policy evaluation, replay simulation and controlled enforcement"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[project.scripts]
qinzora = "qinzora.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qinzora"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

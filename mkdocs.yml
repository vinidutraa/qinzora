site_name: Qinzora
site_description: Open-source Python API policy evaluation, tenant isolation, rate limiting and historical simulation.
site_url: https://vinidutraa.github.io/qinzora/
repo_url: https://github.com/vinidutraa/qinzora
repo_name: vinidutraa/qinzora
hooks:
  - publishing/docs_hooks.py
extra_javascript:
  - assets/navigation.js
extra_css:
  - assets/navigation.css
copyright: Qinzora contributors · MIT License
theme:
  name: material
  custom_dir: publishing/theme
  language: en
  font: false
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Integration:
      - HTTP API: api.md
      - Python SDK: sdk.md
      - CLI: cli.md
  - Policies: policies.md
  - Optional AI: ai.md
  - Experimental continuity: continuity.md
  - Operations:
      - Docker and storage: deployment.md
      - Security: security.md
      - Troubleshooting: troubleshooting.md
      - Validation: validation.md
  - Distribution: distribution.md
  - Contributing: contributing.md
  - History disclosure: history.md

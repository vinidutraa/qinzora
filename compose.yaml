services:
  qinzora:
    build: .
    ports:
      - "127.0.0.1:${QINZORA_PORT:-8765}:8765"
    environment:
      QINZORA_ADMIN_TOKEN: ${QINZORA_ADMIN_TOKEN:?Run qinzora init and keep .env private}
      QINZORA_DB: /data/qinzora.sqlite
    volumes:
      - qinzora-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  qinzora-data:

name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version in pyproject.toml to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify selected version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python -c "import os,tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == os.environ['EXPECTED_VERSION'], 'Version does not match reviewed source'"
      - run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check src tests examples scripts publishing/docs_hooks.py
      - run: python scripts/http_smoke.py
      - run: python -m pip install -r requirements-build.txt
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distribution
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

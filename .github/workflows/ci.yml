name: Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests examples scripts
      - run: python -m ruff format --check src tests examples scripts
      - run: python -m pytest -q
      - run: sentinel demo
      - run: python scripts/http_smoke.py
      - run: python -m pip_audit --disable-pip -r requirements-lock.txt
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/docker_smoke.py

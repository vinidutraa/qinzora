name: Package validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/qinzora-wheel
      - run: /tmp/qinzora-wheel/bin/python -m pip install --require-hashes -r requirements-lock.txt
      - run: /tmp/qinzora-wheel/bin/python -m pip install --no-deps dist/*.whl
      - run: /tmp/qinzora-wheel/bin/qinzora --version
      - run: cd /tmp && /tmp/qinzora-wheel/bin/qinzora demo
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: dist/*
